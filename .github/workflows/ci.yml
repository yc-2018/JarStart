name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 环境信息
        shell: pwsh
        run: |
          Write-Host "runner: $env:RUNNER_OS"
          Write-Host "JAVA_HOME: $env:JAVA_HOME"
          java -version

      - name: 编译
        shell: pwsh
        run: ./build.ps1

      - name: 核心自检（配置 / 日志缓冲 / java 解析 / 端口识别 / 进程启停）
        shell: pwsh
        run: |
          ./tests/make-test-jar.ps1
          ./tests/SelfTest.exe
